{% extends "base.html" %}

{% block content %}

<div class="card shadow">

    <div class="card-header bg-dark text-white">

        <h5 class="mb-0">
            Notification Settings
        </h5>

    </div>

    <div class="card-body">

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    SMTP Server
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="smtp_server"
                    value="{{ settings.smtp_server }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    SMTP Port
                </label>

                <input
                    type="number"
                    class="form-control"
                    name="smtp_port"
                    value="{{ settings.smtp_port }}"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Sender Email
                </label>

                <input
                    type="email"
                    class="form-control"
                    name="from_address"
                    value="{{ settings.from_address }}"
                    placeholder="example@gmail.com">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Recipient Email(s)
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="to_addresses"
                    value="{{ settings.to_addresses }}"
                    placeholder="email1@gmail.com,email2@gmail.com">

                <small class="text-muted">
                    Separate multiple emails with commas.
                </small>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email Subject
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="subject"
                    value="{{ settings.subject }}">

            </div>

            <!-- NEW: SMTP Username -->

            <div class="mb-3">

                <label class="form-label">
                    SMTP Username
                </label>

                <input
                    type="text"
                    class="form-control"
                    name="smtp_username"
                    value="{{ settings.smtp_username }}">

            </div>

            <!-- NEW: SMTP Password -->

            <div class="mb-3">

                <label class="form-label">
                    SMTP Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="smtp_password"
                    value="{{ settings.smtp_password }}">

            </div>

            <!-- NEW: Use TLS -->

            <div class="form-check mb-4">

                <input
                    class="form-check-input"
                    type="checkbox"
                    id="use_tls"
                    name="use_tls"
                    {% if settings.use_tls %}checked{% endif %}>

                <label
                    class="form-check-label"
                    for="use_tls">

                    Enable TLS (Recommended for Gmail/Outlook)

                </label>

            </div>

            <button
                class="btn btn-success">

                Save Settings

            </button>

        </form>

    </div>

</div>

{% endblock %}
